version: '3.8'

services:
  # ProjexLight MCP Server - Code Review Agent
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: projexlight-mcp
    ports:
      - "8766:8766"  # MCP Server API
    volumes:
      - ../:/workspace  # Project root (parent of mcp-server/) mounted to /workspace
      - ./feedback:/feedback  # Feedback files (read-write)
      - ./mcp-config.json:/app/mcp-config.json:ro  # Encrypted configuration
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Enable host network access for API testing
    env_file:
      - .env  # Load environment variables from .env file (includes PROJEXLIGHT_API_URL)
    environment:
      # Configuration will be decrypted on startup from mcp-config.json
      - WORKSPACE_PATH=/workspace
      - FEEDBACK_PATH=/feedback
      - MCP_SERVER_PORT=8766
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_CONFIG_FILE=/app/mcp-config.json
      # Note: PROJEXLIGHT_API_URL is loaded from .env file above
      # To change API URL, edit mcp-server/.env file
      # Database connection is configured via mcp-config.json "databaseConfig" section
      # Or override with environment variables:
      # - DB_HOST=postgres           # Container name on same network
      # - DB_HOST=host.docker.internal  # For database on host machine
      # - DB_HOST=your-rds-host.amazonaws.com  # For external database
    networks:
      - mcp-network
    depends_on:
      - postgres  # Remove this line if not using the postgres container
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8766/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================
  # DATABASE CONTAINERS (Choose one or configure external DB in mcp-config.json)
  # ============================================================
  # Supported databases: PostgreSQL, MySQL, MariaDB, MongoDB, Redis, Cassandra, SQLite, DynamoDB
  # Configure in mcp-config.json "databaseConfig" section or use containers below

  # PostgreSQL (default) - Uncomment to use
  postgres:
    image: postgres:15-alpine
    container_name: projexlight-postgres
    environment:
      - POSTGRES_USER=${DB_USER:-appuser}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-apppassword}
      - POSTGRES_DB=${DB_NAME:-appdb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mcp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-appuser} -d ${DB_NAME:-appdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MySQL - Uncomment to use instead of PostgreSQL
