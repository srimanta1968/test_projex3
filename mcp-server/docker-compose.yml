  #   networks:
  #     - mcp-network
  #   restart: unless-stopped

  # MariaDB - Uncomment to use instead of PostgreSQL
  # mariadb:
  #   image: mariadb:10.11
  #   container_name: projexlight-mariadb
  #   environment:
  #     - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-apppassword}
  #     - MYSQL_DATABASE=${DB_NAME:-appdb}
  #     - MYSQL_USER=${DB_USER:-appuser}
  #     - MYSQL_PASSWORD=${DB_PASSWORD:-apppassword}
  #   ports:
  #     - "3306:3306"
  #   volumes:
